name: Verify scientific records
on: [push, pull_request]
permissions:
  contents: read
jobs:
  saved-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_results.py
      - run: python -m unittest discover -s tests -p test_prepare_arxiv.py
      - run: python scripts/prepare_arxiv.py
